<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CapQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0b1020;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }
    #game-root {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #screen-wrap {
      position: relative;
      box-shadow: 0 0 0 6px #1a2238, 0 14px 40px rgba(0,0,0,0.6);
      border-radius: 6px;
      background: #000;
      line-height: 0;
    }
    canvas#screen {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 4px;
    }
    /* Touch controls */
    #touch {
      display: none;
      width: min(96vw, 460px);
      justify-content: space-between;
      align-items: center;
    }
    body.touch #touch { display: flex; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .btn {
      background: #2a3350;
      border: 2px solid #46527d;
      border-radius: 10px;
      color: #cdd6f4;
      font-family: inherit;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .btn:active { background: #3a4570; }
    .dpad .empty { background: transparent; border: none; }
    #dpad-up { grid-column: 2; grid-row: 1; }
    #dpad-left { grid-column: 1; grid-row: 2; }
    #dpad-right { grid-column: 3; grid-row: 2; }
    #dpad-down { grid-column: 2; grid-row: 3; }
    .ab { display: flex; flex-direction: column; gap: 12px; }
    .ab .btn { width: 62px; height: 62px; border-radius: 50%; font-size: 20px; }
    #btn-a { background: #5a3a4a; border-color: #9d5a72; }
    #btn-b { background: #3a4a5a; border-color: #5a82a0; }
    #hint {
      font-size: 9px;
      color: #6b7494;
      text-align: center;
      max-width: 90vw;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <div id="screen-wrap">
      <canvas id="screen" width="240" height="160"></canvas>
    </div>
    <div id="touch">
      <div class="dpad">
        <button class="btn" id="dpad-up">▲</button>
        <button class="btn" id="dpad-left">◀</button>
        <button class="btn" id="dpad-right">▶</button>
        <button class="btn" id="dpad-down">▼</button>
      </div>
      <div class="ab">
        <button class="btn" id="btn-a">A</button>
        <button class="btn" id="btn-b">B</button>
      </div>
    </div>
    <div id="hint">Piltangenter/WASD = gå &nbsp;·&nbsp; Z/Enter = A (välj) &nbsp;·&nbsp; X = B (tillbaka)</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
